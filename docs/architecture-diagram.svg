<svg xmlns="http://www.w3.org/2000/svg" class="architecture-diagram" viewBox="0 0 1600 1000" role="img" aria-labelledby="diagram-title diagram-desc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="diagram-title">Architecture of the multi-agent dispute resolution system (Ryde case study)</title>
  <desc id="diagram-desc">A Dispute is filed, validated at intake and given a priority, then an orchestrator written in ordinary code runs each stage in order. Every agent reads from and writes to one Case store in the middle; agents never message each other. On the left, the evidence side fills the store: evidence tools, the Rider and Driver Evidence Agents, Image Analysis and the Policy and Precedent Agent, all reading simulated trip records, photos, policy and past rulings. On the right are the three Core Agents: the Rider Advocate and Driver Advocate build their Submissions in parallel without seeing each other, and the Judge rules, optionally twice as a stability check. A History step and a Confidence check, both code, follow. A Ruling with enough Confidence becomes the Outcome sent to both parties with a simulated payment action; otherwise the Escalation Protocol sends it to a review queue where a human reviewer confirms or overrides it, and an Override feeds the Learning Feedback Loop, which adds a Precedent. Every write to the Case store is an event in the Communication Log. Each Supporting Agent is a layer that a console switch turns on.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker>
    <marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475467"/></marker>
    <style>
      .architecture-diagram text { text-anchor: middle; fill: #1d2939; }
      .architecture-diagram .name { font-size: 15px; font-weight: 700; }
      .architecture-diagram .sub { font-size: 12px; fill: #475467; }
      .architecture-diagram .switch { font-size: 12px; font-weight: 700; fill: #5b3cc4; }
      .architecture-diagram .label { font-size: 12px; font-style: italic; fill: #475467; }
      .architecture-diagram .flow { fill: none; stroke: #475467; stroke-width: 1.6; }
      .architecture-diagram .dashed { stroke-dasharray: 5 4; }
      .architecture-diagram .zone { fill: none; stroke: #d0d5dd; stroke-width: 1.2; stroke-dasharray: 2 5; }
      .architecture-diagram .zonename { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #667085; text-anchor: start; }
      .architecture-diagram .core rect { fill: #0e7c66; stroke: #07503f; stroke-width: 3; }
      .architecture-diagram .core .name { fill: #ffffff; font-size: 17px; }
      .architecture-diagram .core .sub { fill: #d6f5ec; }
      .architecture-diagram .supporting rect { fill: #f4f0ff; stroke: #7a5af8; stroke-width: 1.6; stroke-dasharray: 7 4; }
      .architecture-diagram .code rect, .architecture-diagram .terminal rect { fill: #f2f4f7; stroke: #98a2b3; stroke-width: 1.4; }
      .architecture-diagram .simulated > rect:first-child { fill: #fffaeb; stroke: #b54708; stroke-width: 1.4; }
      .architecture-diagram .simulated .tag { fill: #b54708; stroke: none; }
      .architecture-diagram .tagtext { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; fill: #ffffff; }
      .architecture-diagram .store rect { fill: #1d2939; stroke: #0c111d; stroke-width: 3; }
      .architecture-diagram .store .name { fill: #ffffff; font-size: 22px; }
      .architecture-diagram .store .sub { fill: #d0d5dd; font-size: 13px; }
      .architecture-diagram .human rect { fill: #eff8ff; stroke: #1570ef; stroke-width: 1.8; }
      .architecture-diagram .log rect { fill: #ffffff; stroke: #1d2939; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .architecture-diagram .note rect { fill: #ffffff; stroke: #98a2b3; stroke-width: 1.2; }
      .architecture-diagram .legend rect.frame { fill: #ffffff; stroke: #d0d5dd; }
      .architecture-diagram .legend text { text-anchor: start; font-size: 12px; }
      .architecture-diagram .heading { font-size: 24px; font-weight: 700; text-anchor: start; }
      .architecture-diagram .subheading { font-size: 14px; fill: #475467; text-anchor: start; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text class="heading" x="60" y="44">Multi-agent dispute resolution: architecture</text>
  <text class="subheading" x="60" y="68">Ryde case study · Digital Native Track · every agent reads and writes one Case store; no agent messages another</text>
  <rect class="zone" x="44" y="196" width="532" height="508" rx="14"/>
  <text class="zonename" x="60" y="216">EVIDENCE, POLICY AND PRECEDENT</text>
  <rect class="zone" x="1024" y="196" width="552" height="472" rx="14"/>
  <text class="zonename" x="1040" y="660">ARGUMENT AND RULING</text>
  <rect class="zone" x="164" y="716" width="1412" height="240" rx="14"/>
  <text class="zonename" x="180" y="736">OUTCOME AND HUMAN REVIEW</text>
  <g class="terminal">
    <rect x="60" y="96" width="200" height="68" rx="34"/>
    <text class="name" x="160" y="126.5">Dispute filed</text>
    <text class="sub" x="160" y="143.5">by a rider or a driver</text>
  </g>
  <g class="code">
    <rect x="320" y="96" width="220" height="68" rx="10"/>
    <text class="name" x="430" y="126.5">Intake and validation</text>
    <text class="sub" x="430" y="143.5">known Trip, supported category</text>
  </g>
  <g class="supporting">
    <rect x="600" y="96" width="260" height="68" rx="10"/>
    <text class="name" x="730" y="118">SLA &amp; Routing Manager</text>
    <text class="sub" x="730" y="135">priority; Safety Incidents first</text>
    <text class="switch" x="730" y="153">Switch: SLA routing</text>
  </g>
  <g class="code">
    <rect x="920" y="96" width="280" height="68" rx="10"/>
    <text class="name" x="1060" y="126.5">Orchestrator</text>
    <text class="sub" x="1060" y="143.5">code, not a model: runs each stage in order</text>
  </g>
  <path class="flow" d="M260,130 H318" marker-end="url(#head)"/>
  <path class="flow" d="M540,130 H598" marker-end="url(#head)"/>
  <path class="flow" d="M860,130 H918" marker-end="url(#head)"/>
  <path class="flow" d="M1000,164 V186 H800 V418" marker-end="url(#head)"/>
  <text class="label" x="810" y="330" style="text-anchor: start">runs every stage, in order</text>
  <g class="store">
    <rect x="620" y="420" width="360" height="200" rx="10"/>
    <text class="name" x="800" y="491">Case store</text>
    <text class="sub" x="800" y="508">one shared state per Case</text>
    <text class="sub" x="800" y="525">sealed evidence · Policy Clauses · Precedents</text>
    <text class="sub" x="800" y="542">Submissions · Ruling · Outcomes</text>
    <text class="sub" x="800" y="559">every write is a log event</text>
  </g>
  <g class="log">
    <rect x="620" y="650" width="360" height="56" rx="10"/>
    <text class="name" x="800" y="674.5">Communication Log</text>
    <text class="sub" x="800" y="691.5">what was asked, found, argued and decided</text>
  </g>
  <path class="flow dashed" d="M800,620 V648" marker-end="url(#head)"/>
  <g class="simulated">
    <rect x="60" y="236" width="190" height="58" rx="10"/>
    <text class="name" x="155" y="261.5">Policy</text>
    <text class="sub" x="155" y="278.5">mock policy clauses</text>
    <rect class="tag" x="166" y="227" width="76" height="18" rx="9"/>
    <text class="tagtext" x="204" y="240">SIMULATED</text>
  </g>
  <g class="simulated">
    <rect x="60" y="316" width="190" height="58" rx="10"/>
    <text class="name" x="155" y="341.5">Past rulings</text>
    <text class="sub" x="155" y="358.5">seeded Precedents</text>
    <rect class="tag" x="166" y="307" width="76" height="18" rx="9"/>
    <text class="tagtext" x="204" y="320">SIMULATED</text>
  </g>
  <g class="supporting">
    <rect x="300" y="240" width="260" height="130" rx="10"/>
    <text class="name" x="430" y="276">Policy &amp; Precedent Agent</text>
    <text class="sub" x="430" y="293">clauses for the category, always;</text>
    <text class="sub" x="430" y="310">similar past Rulings behind the switch,</text>
    <text class="sub" x="430" y="327">advisory only</text>
    <text class="switch" x="430" y="345">Switch: Use precedent</text>
  </g>
  <g class="simulated">
    <rect x="60" y="420" width="190" height="70" rx="10"/>
    <text class="name" x="155" y="443">Trip records</text>
    <text class="sub" x="155" y="460">GPS · chat · fare · History</text>
    <text class="sub" x="155" y="477">stand in for Ryde's APIs</text>
    <rect class="tag" x="166" y="411" width="76" height="18" rx="9"/>
    <text class="tagtext" x="204" y="424">SIMULATED</text>
  </g>
  <g class="code">
    <rect x="300" y="420" width="260" height="70" rx="10"/>
    <text class="name" x="430" y="443">Evidence tools</text>
    <text class="sub" x="430" y="460">route, wait and fare maths in code;</text>
    <text class="sub" x="430" y="477">typed Evidence Items; gaps are explicit</text>
  </g>
  <g class="supporting">
    <rect x="300" y="510" width="260" height="80" rx="10"/>
    <text class="name" x="430" y="538">Rider &amp; Driver Evidence Agents</text>
    <text class="sub" x="430" y="555">quote facts from chat and statements</text>
    <text class="switch" x="430" y="573">Switch: Evidence agents</text>
  </g>
  <g class="simulated">
    <rect x="60" y="616" width="190" height="58" rx="10"/>
    <text class="name" x="155" y="641.5">Photos</text>
    <text class="sub" x="155" y="658.5">mock mess and damage photos</text>
    <rect class="tag" x="166" y="607" width="76" height="18" rx="9"/>
    <text class="tagtext" x="204" y="620">SIMULATED</text>
  </g>
  <g class="supporting">
    <rect x="300" y="610" width="260" height="80" rx="10"/>
    <text class="name" x="430" y="638">Image Analysis &amp; Authenticity</text>
    <text class="sub" x="430" y="655">what it shows, when taken, AI signs</text>
    <text class="switch" x="430" y="673">Switch: Photo analysis</text>
  </g>
  <path class="flow" d="M250,265 H298" marker-end="url(#head)"/>
  <path class="flow" d="M250,345 H298" marker-end="url(#head)"/>
  <path class="flow" d="M250,455 H298" marker-end="url(#head)"/>
  <path class="flow" d="M275,455 V550 H298" marker-end="url(#head)"/>
  <path class="flow" d="M250,645 H298" marker-end="url(#head)"/>
  <path class="flow" d="M560,305 H590 V650 H560 M560,455 H590 M560,550 H590"/>
  <path class="flow" d="M590,520 H618" marker-end="url(#head)"/>
  <circle cx="275" cy="455" r="3" fill="#475467"/>
  <g class="core">
    <rect x="1060" y="250" width="220" height="84" rx="10"/>
    <text class="name" x="1170" y="280">Rider Advocate</text>
    <text class="sub" x="1170" y="297">argues the rider's side</text>
    <text class="sub" x="1170" y="314">from the sealed evidence</text>
  </g>
  <g class="core">
    <rect x="1320" y="250" width="220" height="84" rx="10"/>
    <text class="name" x="1430" y="280">Driver Advocate</text>
    <text class="sub" x="1430" y="297">argues the driver's side</text>
    <text class="sub" x="1430" y="314">from the sealed evidence</text>
  </g>
  <g class="core">
    <rect x="1060" y="420" width="300" height="110" rx="10"/>
    <text class="name" x="1210" y="454.5">Judge</text>
    <text class="sub" x="1210" y="471.5">weighs both Submissions, accepts or rejects</text>
    <text class="sub" x="1210" y="488.5">each argument, cites evidence and clauses.</text>
    <text class="sub" x="1210" y="505.5">Never sees History.</text>
  </g>
  <g class="supporting">
    <rect x="1390" y="420" width="170" height="110" rx="10"/>
    <text class="name" x="1475" y="454.5">Stability check</text>
    <text class="sub" x="1475" y="471.5">rules twice, order</text>
    <text class="sub" x="1475" y="488.5">of Submissions swapped</text>
    <text class="switch" x="1475" y="506.5">Switch: Stability check</text>
  </g>
  <g class="code">
    <rect x="1060" y="570" width="230" height="70" rx="10"/>
    <text class="name" x="1175" y="593">History step</text>
    <text class="sub" x="1175" y="610">after the outcome is fixed;</text>
    <text class="sub" x="1175" y="627">can only lower Confidence</text>
  </g>
  <g class="code">
    <rect x="1330" y="570" width="230" height="70" rx="10"/>
    <text class="name" x="1445" y="593">Confidence and triggers</text>
    <text class="sub" x="1445" y="610">lowest of its components,</text>
    <text class="sub" x="1445" y="627">against the threshold</text>
  </g>
  <path class="flow" d="M980,476 H1022 V292 H1058" marker-end="url(#head)" marker-start="url(#tail)"/>
  <path class="flow" d="M980,456 H1008 V226 H1430 V248" marker-end="url(#head)" marker-start="url(#tail)"/>
  <text class="label" x="1225" y="218">in parallel; each works without seeing the other</text>
  <path class="flow" d="M980,504 H1058" marker-end="url(#head)" marker-start="url(#tail)"/>
  <path class="flow" d="M1360,475 H1388" marker-end="url(#head)" marker-start="url(#tail)"/>
  <path class="flow" d="M1175,530 V568" marker-end="url(#head)"/>
  <path class="flow" d="M1290,605 H1328" marker-end="url(#head)"/>
  <g class="supporting">
    <rect x="1040" y="750" width="240" height="80" rx="10"/>
    <text class="name" x="1160" y="778">Escalation Protocol</text>
    <text class="sub" x="1160" y="795">review package for a person</text>
    <text class="switch" x="1160" y="813">Config switch: on for every run</text>
  </g>
  <g class="human">
    <rect x="760" y="750" width="220" height="80" rx="10"/>
    <text class="name" x="870" y="786.5">Review queue</text>
    <text class="sub" x="870" y="803.5">held Cases, most urgent first</text>
  </g>
  <g class="human">
    <rect x="480" y="750" width="220" height="80" rx="10"/>
    <text class="name" x="590" y="778">Human Reviewer</text>
    <text class="sub" x="590" y="795">a real person:</text>
    <text class="sub" x="590" y="812">confirms or overrides, with a reason</text>
  </g>
  <g class="supporting">
    <rect x="180" y="750" width="240" height="80" rx="10"/>
    <text class="name" x="300" y="778">Learning Feedback Loop</text>
    <text class="sub" x="300" y="795">an Override becomes a Precedent</text>
    <text class="switch" x="300" y="813">Switch: Learn from overrides</text>
  </g>
  <g class="code simulated">
    <rect x="1330" y="750" width="230" height="80" rx="10"/>
    <text class="name" x="1445" y="778">Outcome to both parties</text>
    <text class="sub" x="1445" y="795">shown on screen, not sent;</text>
    <text class="sub" x="1445" y="812">or 'review pending'</text>
    <rect class="tag" x="1476" y="741" width="76" height="18" rx="9"/>
    <text class="tagtext" x="1514" y="754">SIMULATED</text>
  </g>
  <g class="simulated">
    <rect x="1330" y="868" width="230" height="70" rx="10"/>
    <text class="name" x="1445" y="891">Payment action</text>
    <text class="sub" x="1445" y="908">recommended only;</text>
    <text class="sub" x="1445" y="925">nothing is ever executed</text>
    <rect class="tag" x="1476" y="859" width="76" height="18" rx="9"/>
    <text class="tagtext" x="1514" y="872">SIMULATED</text>
  </g>
  <path class="flow" d="M1440,640 V748" marker-end="url(#head)"/>
  <text class="label" x="1449" y="712" style="text-anchor: start">sufficient</text>
  <path class="flow" d="M1370,640 V690 H1160 V748" marker-end="url(#head)"/>
  <text class="label" x="1265" y="684" style="text-anchor: middle">low Confidence or a review trigger</text>
  <path class="flow" d="M1040,790 H982" marker-end="url(#head)"/>
  <path class="flow" d="M760,790 H702" marker-end="url(#head)"/>
  <path class="flow" d="M480,790 H422" marker-end="url(#head)"/>
  <text class="label" x="451" y="782" style="text-anchor: middle">override</text>
  <path class="flow" d="M180,790 H28 V345 H58" marker-end="url(#head)"/>
  <text class="label" x="104" y="808" style="text-anchor: middle">adds a Precedent</text>
  <path class="flow" d="M590,830 V858 H1390 V832" marker-end="url(#head)"/>
  <text class="label" x="985" y="851" style="text-anchor: middle">confirmed or overridden Ruling</text>
  <path class="flow" d="M1450,830 V866" marker-end="url(#head)"/>
  <g class="note">
    <rect x="180" y="868" width="290" height="70" rx="10"/>
    <text class="name" x="325" y="891">Model adapter</text>
    <text class="sub" x="325" y="908">a live OpenAI-compatible model, or scripted</text>
    <text class="sub" x="325" y="925">replies offline; the header says which</text>
  </g>
  <g class="legend">
    <rect class="frame" x="500" y="874" width="800" height="58" rx="10"/>
    <rect x="516" y="890" width="26" height="26" rx="5" fill="#0e7c66" stroke="#07503f" stroke-width="2"/>
    <text x="550" y="900">Core Agent</text><text class="sub" x="550" y="916">the required three</text>
    <rect x="670" y="890" width="26" height="26" rx="5" fill="#f4f0ff" stroke="#7a5af8" stroke-width="1.6" stroke-dasharray="7 4"/>
    <text x="704" y="900">Supporting Agent</text><text class="sub" x="704" y="916">a switchable layer</text>
    <rect x="868" y="890" width="26" height="26" rx="5" fill="#f2f4f7" stroke="#98a2b3" stroke-width="1.4"/>
    <text x="902" y="900">Code, not a model</text><text class="sub" x="902" y="916">arithmetic, lookup, order</text>
    <rect x="1050" y="890" width="26" height="26" rx="5" fill="#eff8ff" stroke="#1570ef" stroke-width="1.8"/>
    <text x="1084" y="900">Person</text><text class="sub" x="1084" y="916">human review</text>
    <rect x="1168" y="890" width="26" height="26" rx="5" fill="#fffaeb" stroke="#b54708" stroke-width="1.4"/>
    <text x="1202" y="900">Simulated</text><text class="sub" x="1202" y="916">mock data</text>
  </g>
</svg>
