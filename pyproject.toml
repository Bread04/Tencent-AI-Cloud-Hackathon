[project]
name = "ryde-dispute-resolution"
version = "0.1.0"
description = "Multi-agent resolution of rider-driver disputes (Tencent Cloud AI Agent Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
